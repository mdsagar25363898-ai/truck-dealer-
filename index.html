<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Truck Dealer 3D</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <!-- 3D GAME -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hudBox">💰 ৳<span id="money">380000</span></div>
      <div class="hudBox">⛽ <span id="fuel">98</span>%</div>
      <div class="hudBox">🚛 <span id="truckName">Mini Truck</span></div>
    </div>

    <!-- Location -->
    <div id="location">🏪 Showroom</div>

    <!-- Mobile Controls -->
    <div id="controls">

      <div class="movePad">
        <button id="up">▲</button>

        <div class="middle">
          <button id="left">◀</button>
          <button id="down">▼</button>
          <button id="right">▶</button>
        </div>
      </div>

      <div class="actions">
        <button id="run">🏃</button>
        <button id="action">✋</button>
        <button id="truckButton">🚛</button>
      </div>

    </div>

  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="game.js"></script>

</body>
</html>
