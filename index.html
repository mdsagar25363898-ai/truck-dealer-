<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Truck Dealer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div>💰 ৳<b id="money">380000</b></div>
    <div>⛽ <b id="fuel">100</b>%</div>
    <div>📍 <b id="place">Showroom</b></div>
  </div>

  <div id="message">
    🏪 Showroom থেকে শুরু করুন
  </div>

  <button id="actionBtn">
    🚚 ট্রাকে উঠুন
  </button>

  <div id="controls">

    <button class="control up" data-key="up">▲</button>

    <button class="control left" data-key="left">◀</button>

    <button class="control down" data-key="down">▼</button>

    <button class="control right" data-key="right">▶</button>

  </div>

  <div id="mode">
    🚶 WALK
  </div>

</div>

<script src="game.js"></script>

</body>
</html>
