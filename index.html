<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Truck Dealer 3D</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">

    <div class="hudBox">
      💰 <span id="money">380000</span>
    </div>

    <div class="hudBox">
      ⛽ <span id="fuel">98</span>%
    </div>

    <div class="hudBox">
      🚛 <span id="truckName">Mini Truck</span>
    </div>

  </div>

  <div id="locationBox">
    🏪 Showroom
  </div>

  <div id="message">
    Showroom থেকে বের হয়ে আসুন
  </div>

  <!-- Interaction -->
  <button id="actionButton" class="actionButton">
    ✋ INTERACT
  </button>

  <!-- Mobile controls -->
  <div id="controls">

    <div class="dpad">

      <button id="up">▲</button>

      <div>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
      </div>

    </div>

    <div class="gameButtons">

      <button id="runButton">🏃</button>

      <button id="handButton">✋</button>

      <button id="truckButton">🚛</button>

    </div>

  </div>

</div>

<script type="module" src="game.js"></script>

</body>
</html>
